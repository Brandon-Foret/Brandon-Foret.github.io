<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 100px;
      left: 0;
      cursor: pointer;
    }

    .board {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box");
      var board = jQuery(".board");
      var boardWidth = board.width();

      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      box.on("click", handleBoxClick);

      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX + "px");
      }

      function changeBoxText(newText) {
        box.text(newText);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      var points = 0;
      var positionX = 0;
      var speed = 300;
      var direction = 1;

      var lastTime = performance.now();

      function update(currentTime) {

        var deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        positionX += speed * direction * deltaTime;

        if (positionX + box.width() >= boardWidth) {
          positionX = boardWidth - box.width();
          direction = -1;
        }

        if (positionX <= 0) {
          positionX = 0;
          direction = 1;
        }

        moveBoxTo(positionX);

        requestAnimationFrame(update);
      }

      function handleBoxClick() {
        points++;
        changeBoxText(points);

        speed += 50;
        positionX = 0;
        direction = 1;

        moveBoxTo(positionX);
      }

      requestAnimationFrame(update);

    })();
  </script>
</body>

</html>
