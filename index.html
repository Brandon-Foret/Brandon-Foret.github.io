<!DOCTYPE html>
<html>

<head>
  <title>Brandon's Desktop</title>

  <link rel="icon" href="icon.JPG" type="image/x-icon">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="desktop">

    <div id="desktop-icons">

      <button class="desktop-app" data-url="home.html" data-title="Home">
        <div class="app-icon">🏠</div>
        <div class="app-name">Home</div>
      </button>

      <button class="desktop-app" data-url="portfolio.html" data-title="Portfolio">
        <div class="app-icon">📂</div>
        <div class="app-name">Operation Spark (Portfolio)</div>
      </button>


      <button class="desktop-app" data-url="blog.html" data-title="Blog">
        <div class="app-icon">📝</div>
        <div class="app-name">Blog</div>
      </button>


      <button class="desktop-app" data-url="links.html" data-title="Links">
        <div class="app-icon">🔗</div>
        <div class="app-name">Links</div>
      </button>

    </div>

    <div id="window-area"></div>

    <div id="jumper">
      <img src="lilhappijumpy.png" alt="Bouncy image">
    </div>

    <div id="start-menu">

      <div class="start-title">
        Kitty OS
      </div>

      <button class="start-item" data-url="home.html" data-title="Home">
        Home
      </button>

      <button class="start-item" data-url="blog.html" data-title="Blog">
        Operation Spark (Portfolio)
      </button>

      <button class="start-item" data-url="blog.html" data-title="Blog">
        Blog
      </button>

      <button class="start-item" data-url="links.html" data-title="Links">
        Links
      </button>

    </div>

    <div id="taskbar">

      <button id="start-button">
        🍊
      </button>

      <div id="taskbar-windows"></div>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
